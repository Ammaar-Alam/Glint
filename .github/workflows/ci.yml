name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    strategy:
      fail-fast: false
      matrix:
        runner: [xcode-27, macos-26]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version
      - name: Tests
        run: swift test
        env:
          # print each test as it runs, so a hang shows which test is stuck
          NSUnbufferedIO: "YES"
      - name: App bundle
        run: scripts/build-app.sh
