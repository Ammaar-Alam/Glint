name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    strategy:
      fail-fast: false
      matrix:
        runner: [xcode-27, macos-26]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version
      - name: Tests
        timeout-minutes: 8
        run: |
          # a stuck test leaves its stack in the log instead of a silent timeout
          (sleep 360; pid=$(pgrep -n xctest || pgrep -n -f swiftpm-testing-helper); [ -n "$pid" ] && sample "$pid" 3 -mayDie 2>&1 | grep -vE "^\s*$" | head -200) &
          swift test
        env:
          # print each test as it runs, so a hang shows which test is stuck
          NSUnbufferedIO: "YES"
      - name: App bundle
        run: scripts/build-app.sh
