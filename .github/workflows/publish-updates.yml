name: Publish updates

# rebuilds the update feed from every published release, so publishing a release is what ships it to installed copies
on:
  release:
    types: [published, edited, deleted]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  feed:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Build the feed
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir site
          # until a stable release exists every release is a pre-release and ships to everyone, after that betas stay out
          stable="$(gh release list -R "$REPO" --exclude-drafts --exclude-pre-releases --limit 1 --json tagName -q length)"
          flags=(--exclude-drafts)
          if [ "$stable" -gt 0 ]; then flags+=(--exclude-pre-releases); fi
          tags="$(gh release list -R "$REPO" "${flags[@]}" --limit 100 --json tagName -q '.[].tagName')"
          expected=0
          {
            echo '<?xml version="1.0" encoding="utf-8"?>'
            echo '<rss version="2.0" xmlns:sparkle="http://www.andymatuschak.org/xml-namespaces/sparkle">'
            echo '  <channel>'
            echo '    <title>Glint</title>'
            # newest first, releases from before in-app updates have no entry and are skipped, a failed download stops the run
            for tag in $tags; do
              assets="$(gh release view "$tag" -R "$REPO" --json assets -q '.assets[].name')"
              if grep -qx 'appcast-item.xml' <<< "$assets"; then
                gh release download "$tag" -R "$REPO" -p appcast-item.xml -O -
                expected=$((expected + 1))
              fi
            done
            echo '  </channel>'
            echo '</rss>'
          } > site/appcast.xml
          # a feed missing a version would hide updates, so only a complete one is deployed
          count="$(python3 -c 'import xml.etree.ElementTree as t; print(len(t.parse("site/appcast.xml").findall("channel/item")))')"
          echo "$count versions in the feed"
          if [ "$count" -ne "$expected" ] || [ "$count" -eq 0 ]; then echo "expected $expected versions" >&2; exit 1; fi
      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v5.0.1
